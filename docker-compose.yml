services:
  delivery:
    build: ./backend
    ports:
      - "${PORT:-8090}:8090"
    environment:
      PORT: "8090"
      # Внутри контейнера Vault доступен на хосте; на Linux замените на
      # адрес машины с проектом (например, http://172.17.0.1:8080).
      VAULT_URL: ${VAULT_URL:-http://host.docker.internal:8080}
      CLIENT_ID: ${CLIENT_ID:-delivery}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:8090/callback}
      SCOPES: ${SCOPES:-full_name,email,phone,address}
